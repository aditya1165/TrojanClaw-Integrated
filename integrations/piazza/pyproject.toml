[project]
name = "trojanclaw-piazza"
version = "0.1.0"
description = "Account-scoped Piazza MCP tools and persistent Chromium sign-in"
requires-python = ">=3.12,<3.15"
dependencies = ["mcp-piazza==0.1.0", "patchright==1.64.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trojanclaw_piazza"]

[dependency-groups]
dev = ["pytest==8.3.5"]
